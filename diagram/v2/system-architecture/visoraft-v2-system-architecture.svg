  <text x="480" y="225" fill="#a7f3d0" font-size="11" text-anchor="middle">Workflow · Version · Run</text>
  <text x="480" y="244" fill="#a7f3d0" font-size="11" text-anchor="middle">Approval · Delivery · RBAC</text>

  <rect x="335" y="330" width="290" height="90" rx="8" fill="#0f172a"/>
  <rect x="335" y="330" width="290" height="90" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
