  <rect x="685" y="105" width="250" height="710" rx="14" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="702" y="130" fill="#fb923c" font-size="12" font-weight="600">持久执行面</text>
  <rect x="965" y="105" width="300" height="710" rx="14" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
