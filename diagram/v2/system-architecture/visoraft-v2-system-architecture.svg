  <rect x="335" y="170" width="290" height="90" rx="8" fill="#0f172a"/>
  <rect x="335" y="170" width="290" height="90" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
