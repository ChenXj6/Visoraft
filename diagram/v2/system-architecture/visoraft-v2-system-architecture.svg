    <text x="90" y="58" fill="#fed7aa" font-size="10" text-anchor="middle">event history / timers</text>
  </g>

  <g transform="translate(1025,700)">
    <rect x="0" y="10" width="180" height="55" fill="#0f172a"/>
    <ellipse cx="90" cy="10" rx="90" ry="13" fill="#0f172a"/>
    <ellipse cx="90" cy="65" rx="90" ry="13" fill="#0f172a"/>
    <rect x="0" y="10" width="180" height="55" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="90" cy="10" rx="90" ry="13" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="90" cy="65" rx="90" ry="13" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="65" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="180" y1="10" x2="180" y2="65" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="90" y="40" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">S3 Media Assets</text>
    <text x="90" y="58" fill="#ddd6fe" font-size="10" text-anchor="middle">hash / versions / manifests</text>
  </g>

  <rect x="40" y="850" width="1460" height="80" rx="10" fill="rgba(30,41,59,0.65)" stroke="#334155" stroke-width="1"/>
  <text x="65" y="880" fill="#f8fafc" font-size="12" font-weight="600">关键边界</text>
  <text x="65" y="905" fill="#cbd5e1" font-size="11">PostgreSQL 是产品状态真相；Temporal 是执行历史真相；S3 是媒体真相。外部发布采用幂等指纹 + uncertain + reconcile，不承诺全平台 exactly-once。</text>
  <text x="1475" y="955" fill="#64748b" font-size="10" text-anchor="end">V2 proposed architecture · 2026-08-14</text>
</svg>
