    <text x="90" y="58" fill="#ddd6fe" font-size="10" text-anchor="middle">control state / projections</text>
  </g>

  <g transform="translate(720,700)">
    <rect x="0" y="10" width="180" height="55" fill="#0f172a"/>
    <ellipse cx="90" cy="10" rx="90" ry="13" fill="#0f172a"/>
    <ellipse cx="90" cy="65" rx="90" ry="13" fill="#0f172a"/>
    <rect x="0" y="10" width="180" height="55" fill="rgba(251,146,60,0.3)"/>
