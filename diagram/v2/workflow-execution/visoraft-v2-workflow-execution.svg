<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1420">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1200" height="1420" fill="#0f172a"/>
  <rect width="1200" height="1420" fill="url(#grid)"/>

  <text x="40" y="45" fill="#f8fafc" font-size="24" font-weight="700">Visoraft V2 工作流执行与恢复</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">从授权来源触发，到处理、审批、排期、多目标发布和不确定结果对账</text>

  <rect x="145" y="95" width="910" height="1195" rx="18" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="165" y="122" fill="#64748b" font-size="12" font-weight="600">不可变 WORKFLOW VERSION + 持久 RUN / NODE RUN</text>

  <!-- connectors behind nodes -->
  <path d="M600 185 L600 235" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M600 305 L600 355" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M600 425 L600 475" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M600 545 L600 595" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M600 665 L600 715" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M600 785 L600 835" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M600 905 L600 955" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M600 1025 L600 1075" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <path d="M600 1145 L600 1195" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <path d="M655 270 L850 270" fill="none" stroke="#fb7185" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrow-rose)"/>
  <path d="M980 310 L1040 310 L1040 210 L650 210 L650 235" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M655 510 L850 510" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M545 870 L350 870" fill="none" stroke="#fb7185" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrow-rose)"/>
  <path d="M220 910 L160 910 L160 750 L400 750" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M655 1230 L850 1230" fill="none" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M980 1270 L1080 1270 L1080 1110 L800 1110" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M600 1265 L600 1315" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- start -->
  <rect x="475" y="135" width="250" height="50" rx="25" fill="#0f172a"/>
  <rect x="475" y="135" width="250" height="50" rx="25" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="600" y="166" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">新内容事件 / 手动运行</text>

  <!-- health decision -->
  <g transform="translate(600,270)">
    <polygon points="0,-35 55,0 0,35 -55,0" fill="#0f172a"/>
    <polygon points="0,-35 55,0 0,35 -55,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.7"/>
    <text y="-3" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">连接健康?</text>
    <text y="15" fill="#94a3b8" font-size="10" text-anchor="middle">scope / token</text>
  </g>
  <text x="615" y="332" fill="#34d399" font-size="11">是</text>
  <text x="735" y="258" fill="#fb7185" font-size="11">否</text>

  <rect x="850" y="235" width="260" height="75" rx="8" fill="#0f172a"/>
  <rect x="850" y="235" width="260" height="75" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="980" y="264" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">等待连接恢复</text>
  <text x="980" y="286" fill="#cbd5e1" font-size="11" text-anchor="middle">提醒 · OAuth 重连 · 自动复检</text>

  <!-- ingestion -->
  <rect x="450" y="355" width="300" height="70" rx="8" fill="#0f172a"/>
  <rect x="450" y="355" width="300" height="70" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="600" y="383" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">规范化来源事件</text>
  <text x="600" y="405" fill="#94a3b8" font-size="11" text-anchor="middle">游标 · external id · revision · origin</text>

  <!-- dedupe -->
  <g transform="translate(600,510)">
    <polygon points="0,-35 55,0 0,35 -55,0" fill="#0f172a"/>
    <polygon points="0,-35 55,0 0,35 -55,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.7"/>
    <text y="-3" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">重复/回流?</text>
    <text y="15" fill="#94a3b8" font-size="10" text-anchor="middle">fingerprint</text>
  </g>
  <text x="615" y="572" fill="#34d399" font-size="11">否</text>
  <text x="735" y="498" fill="#94a3b8" font-size="11">是</text>

  <rect x="850" y="475" width="260" height="70" rx="8" fill="#0f172a"/>
  <rect x="850" y="475" width="260" height="70" rx="8" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="980" y="503" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">记录并跳过</text>
  <text x="980" y="525" fill="#94a3b8" font-size="11" text-anchor="middle">不创建重复 Run / Delivery</text>

  <!-- version -->
  <rect x="430" y="595" width="340" height="70" rx="8" fill="#0f172a"/>
  <rect x="430" y="595" width="340" height="70" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="600" y="623" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">绑定已发布工作流版本</text>
  <text x="600" y="645" fill="#c4b5fd" font-size="11" text-anchor="middle">WorkflowVersion + Run + ContentItem</text>

  <!-- processing -->
  <rect x="400" y="715" width="400" height="70" rx="8" fill="#0f172a"/>
  <rect x="400" y="715" width="400" height="70" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.6"/>
  <text x="600" y="743" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">过滤 + 处理 + 备份</text>
  <text x="600" y="765" fill="#a7f3d0" font-size="11" text-anchor="middle">resize · trim · subtitle · LocalizeForChina</text>

  <!-- approval -->
  <g transform="translate(600,870)">
    <polygon points="0,-35 55,0 0,35 -55,0" fill="#0f172a"/>
    <polygon points="0,-35 55,0 0,35 -55,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.7"/>
    <text y="-3" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">审批通过?</text>
    <text y="15" fill="#94a3b8" font-size="10" text-anchor="middle">规则 / 期限</text>
  </g>
  <text x="615" y="932" fill="#34d399" font-size="11">是</text>
  <text x="410" y="858" fill="#fb7185" font-size="11">否 / 退回 / 过期</text>

  <rect x="90" y="835" width="260" height="75" rx="8" fill="#0f172a"/>
  <rect x="90" y="835" width="260" height="75" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="220" y="864" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">停止发布 / 修改后重提</text>
  <text x="220" y="886" fill="#fecdd3" font-size="11" text-anchor="middle">审计记录 · 不绕过治理</text>

  <!-- schedule -->
  <rect x="420" y="955" width="360" height="70" rx="8" fill="#0f172a"/>
  <rect x="420" y="955" width="360" height="70" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="600" y="983" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">排期与发布保护</text>
  <text x="600" y="1005" fill="#94a3b8" font-size="11" text-anchor="middle">时区 · 时间窗 · 限额 · 最小间隔</text>

  <!-- publish -->
  <rect x="400" y="1075" width="400" height="70" rx="8" fill="#0f172a"/>
  <rect x="400" y="1075" width="400" height="70" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.6"/>
  <text x="600" y="1103" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">并行创建多目标 Delivery</text>
  <text x="600" y="1125" fill="#a7f3d0" font-size="11" text-anchor="middle">reservation · publish · remote id</text>

  <!-- uncertainty -->
  <g transform="translate(600,1230)">
    <polygon points="0,-35 55,0 0,35 -55,0" fill="#0f172a"/>
    <polygon points="0,-35 55,0 0,35 -55,0" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.7"/>
    <text y="-3" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">结果确定?</text>
    <text y="15" fill="#94a3b8" font-size="10" text-anchor="middle">partial / timeout</text>
  </g>
  <text x="615" y="1292" fill="#34d399" font-size="11">是</text>
  <text x="735" y="1218" fill="#fbbf24" font-size="11">否</text>

  <rect x="850" y="1195" width="260" height="75" rx="8" fill="#0f172a"/>
  <rect x="850" y="1195" width="260" height="75" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="980" y="1224" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">远端状态对账</text>
  <text x="980" y="1246" fill="#fde68a" font-size="11" text-anchor="middle">先 reconcile，再决定重试</text>

  <!-- end -->
  <rect x="430" y="1315" width="340" height="55" rx="28" fill="#0f172a"/>
  <rect x="430" y="1315" width="340" height="55" rx="28" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="600" y="1348" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">成功 / 部分成功 / 终止并留证</text>

  <rect x="165" y="1390" width="12" height="12" rx="2" fill="#22d3ee"/>
  <text x="187" y="1401" fill="#cbd5e1" font-size="11">主流程</text>
  <rect x="275" y="1390" width="12" height="12" rx="2" fill="#fb7185"/>
  <text x="297" y="1401" fill="#cbd5e1" font-size="11">阻断/治理</text>
  <rect x="425" y="1390" width="12" height="12" rx="2" fill="#fbbf24"/>
  <text x="447" y="1401" fill="#cbd5e1" font-size="11">不确定与回查</text>
  <text x="1035" y="1401" fill="#64748b" font-size="10" text-anchor="end">V2 proposal · 2026-08-14</text>
</svg>
